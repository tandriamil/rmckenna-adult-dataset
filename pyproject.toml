[project]
name = "rad"
version = "0.2.0"
description = "Application of the R. McKenna mechanism to the adult dataset"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "ipykernel>=6.30.1",
    "loguru==0.5.3",
    "matplotlib==3.4.2",
    "networkx==2.5.1",
    "nose>=1.3.7",
    "numpy==1.22.0",
    "pandas==1.3.0",
    "pip>=25.2",
    "scikit-learn==1.0.1",
    "scipy==1.10.0",
    "ucimlrepo>=0.0.7",
]

[build-system]
requires = ["uv_build (>=0.8.0,<1.0.0)"]
build-backend = "uv_build"
