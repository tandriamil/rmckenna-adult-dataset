[project]
name = "rad"
version = "0.2.0"
description = "Application of the R. McKenna mechanism to the adult dataset"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "ipykernel (>=6.30.1,<7.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "matplotlib (>=3.4.2,<4.0.0)",
    "networkx (>=2.5.1,<3.0.0)",
    "numpy (>=1.22.0,<3.0.0)",
    "pandas (>=1.3.0,<2.0.0)",
    "scipy (>=1.10.0,<2.0.0)",
    "ucimlrepo (>=0.0.7,<0.1.0)",
    "tensorflow-privacy (>=0.6.2,<0.7.0)",
    "tensorflow (>=2.13.1,<2.16.0)",
    "mbi @ file://${PROJECT_ROOT}/mbi"
]

[build-system]
requires = ["uv_build (>=0.8.0,<1.0.0)"]
build-backend = "uv_build"
